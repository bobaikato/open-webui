name: 'Test: Ota contract matrix'

on:
  workflow_dispatch:
    inputs:
      ota_version:
        description: Released Ota version to install for this matrix run
        required: false
        default: v1.6.20
  pull_request:
    paths:
      - 'ota.yaml'
      - '.gitignore'
      - '.github/workflows/test-ota-contract-matrix.yml'
  push:
    paths:
      - 'ota.yaml'
      - '.gitignore'
      - '.github/workflows/test-ota-contract-matrix.yml'

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: '1'
  OTA_VERSION: ${{ github.event.inputs.ota_version || 'v1.6.20' }}

jobs:
  native:
    name: Ota Contract Matrix (Native - ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            run_shell: bash
            full_runtime_proof: true
          - name: macos
            os: macos-latest
            run_shell: bash
            full_runtime_proof: false
          - name: windows
            os: windows-latest
            run_shell: pwsh
            full_runtime_proof: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ota (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION="${OTA_VERSION}" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ota (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OTA_VERSION = "${env:OTA_VERSION}"
          irm https://dist.ota.run/install.ps1 | iex
          (Join-Path $env:LOCALAPPDATA "ota\\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Contract gates [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          mkdir -p .ota/ci
          ota validate --json . > .ota/ci/validate.json
          ota validate .
          ota doctor --json . > .ota/ci/doctor.json
          ota doctor .
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --workflow verify .
          ota tasks --workflow native .
          ota tasks --workflow frontend .
          ota tasks --workflow docker .
          ota execution topology --json . > .ota/ci/execution-topology.json

      - name: Contract gates [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ota/ci | Out-Null
          ota validate --json . | Out-File -FilePath .ota/ci/validate.json -Encoding utf8
          ota validate .
          ota doctor --json . | Out-File -FilePath .ota/ci/doctor.json -Encoding utf8
          ota doctor .
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --workflow verify .
          ota tasks --workflow native .
          ota tasks --workflow frontend .
          ota tasks --workflow docker .
          ota execution topology --json . | Out-File -FilePath .ota/ci/execution-topology.json -Encoding utf8

      - name: Dry-run verify and native workflows [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota run verify --dry-run --json . > .ota/ci/run-verify-dry-run.json
          ota up --workflow native --dry-run --json . > .ota/ci/up-native-dry-run.json

      - name: Dry-run verify and native workflows [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          ota run verify --dry-run --json . | Out-File -FilePath .ota/ci/run-verify-dry-run.json -Encoding utf8
          ota up --workflow native --dry-run --json . | Out-File -FilePath .ota/ci/up-native-dry-run.json -Encoding utf8

      - name: Dry-run docker workflow
        if: matrix.full_runtime_proof
        shell: bash
        run: |
          ota up --workflow docker --dry-run --json . > .ota/ci/up-docker-dry-run.json

      - name: Execute finite verification tasks [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota run verify:backend:format --json . > .ota/ci/run-verify-backend-format.json
          ota run test:frontend --json . > .ota/ci/run-test-frontend.json

      - name: Execute finite verification tasks [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          ota run verify:backend:format --json . | Out-File -FilePath .ota/ci/run-verify-backend-format.json -Encoding utf8
          ota run test:frontend --json . | Out-File -FilePath .ota/ci/run-test-frontend.json -Encoding utf8

      - name: Execute full frontend verify lane
        if: matrix.full_runtime_proof
        shell: bash
        run: |
          ota run verify:frontend --json . > .ota/ci/run-verify-frontend.json

      - name: Proof packaged native workflow
        if: matrix.full_runtime_proof
        uses: ota-run/action@v1
        with:
          command: proof
          workflow: native
          install: never
          comment-pr: false
          artifact-name: ota-proof-native-${{ matrix.name }}
          output-path: .ota-proof-native-${{ matrix.name }}.json

      - name: Proof Docker Compose workflow
        if: matrix.full_runtime_proof
        uses: ota-run/action@v1
        with:
          command: proof
          workflow: docker
          install: never
          comment-pr: false
          artifact-name: ota-proof-docker-${{ matrix.name }}
          output-path: .ota-proof-docker-${{ matrix.name }}.json

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          path: |
            .ota-proof-native-${{ matrix.name }}.json
            .ota-proof-docker-${{ matrix.name }}.json
            .ota/
          retention-days: 7
