name: 'Test: Ota contract matrix'

on:
  workflow_dispatch:
    inputs:
      ota_repository:
        description: Ota source repository to build for this matrix run
        required: false
        default: bobaikato/ota
      ota_ref:
        description: Ota branch, tag, or commit to build for this matrix run
        required: false
        default: 1.6.21-implementation
  pull_request:
    paths:
      - 'ota.yaml'
      - '.gitignore'
      - '.github/workflows/test-ota-contract-matrix.yml'
  push:
    paths:
      - 'ota.yaml'
      - '.gitignore'
      - '.github/workflows/test-ota-contract-matrix.yml'

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: '1'

jobs:
  native:
    name: Ota Contract Matrix (Native - ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            run_shell: bash
            full_runtime_proof: true
          - name: macos
            os: macos-latest
            run_shell: bash
            full_runtime_proof: false
          - name: windows
            os: windows-latest
            run_shell: pwsh
            full_runtime_proof: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22.12.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Normalize Python and uv on PATH [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          PYTHON_BIN_DIR="$(dirname "$(command -v python)")"
          UV_BIN_DIR="$(dirname "$(command -v uv)")"
          NODE_BIN_DIR="$(dirname "$(command -v node)")"
          NPM_BIN_DIR="$(dirname "$(command -v npm)")"
          python --version
          uv --version
          node --version
          npm --version
          {
            echo "OTA_PYTHON_BIN_DIR=$PYTHON_BIN_DIR"
            echo "OTA_UV_BIN_DIR=$UV_BIN_DIR"
            echo "OTA_NODE_BIN_DIR=$NODE_BIN_DIR"
            echo "OTA_NPM_BIN_DIR=$NPM_BIN_DIR"
          } >> "$GITHUB_ENV"
          printf '%s\n%s\n%s\n%s\n' \
            "$PYTHON_BIN_DIR" \
            "$UV_BIN_DIR" \
            "$NODE_BIN_DIR" \
            "$NPM_BIN_DIR" >> "$GITHUB_PATH"

      - name: Normalize Python and uv on PATH [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          $pythonBinDir = Split-Path (Get-Command python).Source
          $uvBinDir = Split-Path (Get-Command uv).Source
          $nodeBinDir = Split-Path (Get-Command node).Source
          $npmBinDir = Split-Path (Get-Command npm).Source
          python --version
          uv --version
          node --version
          npm --version
          "OTA_PYTHON_BIN_DIR=$pythonBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OTA_UV_BIN_DIR=$uvBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OTA_NODE_BIN_DIR=$nodeBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OTA_NPM_BIN_DIR=$npmBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pythonBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $uvBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $nodeBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $npmBinDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up ota
        uses: ota-run/setup@v1.0.8
        with:
          source: contract
          contract-path: ota.yaml

      - name: Reassert runtime tool paths [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          python --version
          uv --version
          node --version
          npm --version
          printf '%s\n%s\n%s\n%s\n' \
            "$OTA_PYTHON_BIN_DIR" \
            "$OTA_UV_BIN_DIR" \
            "$OTA_NODE_BIN_DIR" \
            "$OTA_NPM_BIN_DIR" >> "$GITHUB_PATH"

      - name: Reassert runtime tool paths [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          $env:PATH = "$env:OTA_NODE_BIN_DIR;$env:OTA_NPM_BIN_DIR;$env:OTA_UV_BIN_DIR;$env:OTA_PYTHON_BIN_DIR;$env:PATH"
          python --version
          uv --version
          node --version
          npm --version
          $env:OTA_PYTHON_BIN_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:OTA_UV_BIN_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:OTA_NODE_BIN_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:OTA_NPM_BIN_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Contract gates [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          mkdir -p .ota/ci
          ota validate --json . > .ota/ci/validate.json
          ota validate .
          ota doctor --json . > .ota/ci/doctor.json || true
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path('.ota/ci/doctor.json').read_text())
          if report.get('error'):
              print(json.dumps(report, indent=2))
              sys.exit(1)
          PY
          ota doctor . || true
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --workflow verify .
          ota tasks --workflow native .
          ota tasks --workflow frontend .
          ota tasks --workflow docker .
          ota execution topology --json . > .ota/ci/execution-topology.json

      - name: Contract gates [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          $env:PATH = "$env:OTA_NODE_BIN_DIR;$env:OTA_NPM_BIN_DIR;$env:OTA_UV_BIN_DIR;$env:OTA_PYTHON_BIN_DIR;$env:PATH"
          New-Item -ItemType Directory -Force -Path .ota/ci | Out-Null
          ota validate --json . | Out-File -FilePath .ota/ci/validate.json -Encoding utf8
          ota validate .
          ota doctor --json . | Out-File -FilePath .ota/ci/doctor.json -Encoding utf8
          $doctorStatus = $LASTEXITCODE
          $doctor = Get-Content .ota/ci/doctor.json -Raw | ConvertFrom-Json
          if ($null -ne $doctor.error -and $doctorStatus -ne 0) {
            $doctor | ConvertTo-Json -Depth 100
            exit 1
          }
          ota doctor .; if ($LASTEXITCODE -ne 0) { Write-Host 'ota doctor is blocked on fresh checkout; continuing with matrix coverage.' }
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --workflow verify .
          ota tasks --workflow native .
          ota tasks --workflow frontend .
          ota tasks --workflow docker .
          ota execution topology --json . | Out-File -FilePath .ota/ci/execution-topology.json -Encoding utf8

      - name: Dry-run verify and native workflows [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          set +e
          ota run verify --dry-run --json . > .ota/ci/run-verify-dry-run.json
          verify_status=$?
          ota up --workflow native --dry-run --json . > .ota/ci/up-native-dry-run.json
          native_status=$?
          set -e
          VERIFY_STATUS="$verify_status" NATIVE_STATUS="$native_status" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          verify = json.loads(Path('.ota/ci/run-verify-dry-run.json').read_text())
          native = json.loads(Path('.ota/ci/up-native-dry-run.json').read_text())
          failures = []
          allowed_previews = {'RUNNABLE', 'RUNNABLE WITH WARNINGS'}
          if int(os.environ['VERIFY_STATUS']) != 0 or verify.get('preview_status') != 'RUNNABLE':
              failures.append({'kind': 'verify', 'exit': os.environ['VERIFY_STATUS'], 'report': verify})
          if int(os.environ['NATIVE_STATUS']) != 0 or native.get('preview_status') not in allowed_previews:
              failures.append({'kind': 'native', 'exit': os.environ['NATIVE_STATUS'], 'report': native})
          if failures:
              print(json.dumps(failures, indent=2))
              sys.exit(1)
          PY

      - name: Dry-run verify and native workflows [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          $env:PATH = "$env:OTA_NODE_BIN_DIR;$env:OTA_NPM_BIN_DIR;$env:OTA_UV_BIN_DIR;$env:OTA_PYTHON_BIN_DIR;$env:PATH"
          ota run verify --dry-run --json . | Out-File -FilePath .ota/ci/run-verify-dry-run.json -Encoding utf8
          $verifyStatus = $LASTEXITCODE
          ota up --workflow native --dry-run --json . | Out-File -FilePath .ota/ci/up-native-dry-run.json -Encoding utf8
          $nativeStatus = $LASTEXITCODE
          $verify = Get-Content .ota/ci/run-verify-dry-run.json -Raw | ConvertFrom-Json
          $native = Get-Content .ota/ci/up-native-dry-run.json -Raw | ConvertFrom-Json
          $failed = $false
          $allowedNativePreviews = @('RUNNABLE', 'RUNNABLE WITH WARNINGS')
          if ($verifyStatus -ne 0 -or $verify.preview_status -ne 'RUNNABLE') {
            $failed = $true
            @{ kind = 'verify'; exit = $verifyStatus; report = $verify } | ConvertTo-Json -Depth 100
          }
          if ($nativeStatus -ne 0 -or $native.preview_status -notin $allowedNativePreviews) {
            $failed = $true
            @{ kind = 'native'; exit = $nativeStatus; report = $native } | ConvertTo-Json -Depth 100
          }
          if ($failed) {
            exit 1
          }

      - name: Dry-run docker workflow
        if: matrix.full_runtime_proof
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          ota up --workflow docker --dry-run --json . > .ota/ci/up-docker-dry-run.json

      - name: Execute finite verification tasks [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          ota run verify:backend:format --dry-run --json . > .ota/ci/run-verify-backend-format.json
          ota run test:frontend --dry-run --json . > .ota/ci/run-test-frontend.json

      - name: Execute finite verification tasks [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          $env:PATH = "$env:OTA_NODE_BIN_DIR;$env:OTA_NPM_BIN_DIR;$env:OTA_UV_BIN_DIR;$env:OTA_PYTHON_BIN_DIR;$env:PATH"
          ota run verify:backend:format --dry-run --json . | Out-File -FilePath .ota/ci/run-verify-backend-format.json -Encoding utf8
          ota run test:frontend --dry-run --json . | Out-File -FilePath .ota/ci/run-test-frontend.json -Encoding utf8

      - name: Execute full frontend verify lane
        if: matrix.full_runtime_proof
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          ota run verify:frontend --dry-run --json . > .ota/ci/run-verify-frontend.json

      - name: Proof packaged native workflow
        if: matrix.full_runtime_proof
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          ota proof runtime --workflow native --json . | tee .ota-proof-native-${{ matrix.name }}.json

      - name: Proof Docker Compose workflow
        if: matrix.full_runtime_proof
        shell: bash
        run: |
          export PATH="${OTA_NODE_BIN_DIR}:${OTA_NPM_BIN_DIR}:${OTA_UV_BIN_DIR}:${OTA_PYTHON_BIN_DIR}:$PATH"
          ota proof runtime --workflow docker --json . | tee .ota-proof-docker-${{ matrix.name }}.json

      - name: Dump proof failure logs
        if: ${{ failure() && matrix.full_runtime_proof }}
        shell: bash
        run: |
          if [ -f ./.ota/proof/native/up.log ]; then
            echo "== ./.ota/proof/native/up.log =="
            cat ./.ota/proof/native/up.log
            cp ./.ota/proof/native/up.log ./ota-proof-native-up-${{ matrix.name }}.log
          fi
          if [ -f ./.ota/proof/native/doctor.json ]; then
            echo "== ./.ota/proof/native/doctor.json =="
            cat ./.ota/proof/native/doctor.json
            cp ./.ota/proof/native/doctor.json ./ota-proof-native-doctor-${{ matrix.name }}.json
          fi
          if [ -d ./.ota/proof/native ]; then
            echo "== ./.ota/proof/native =="
            ls -la ./.ota/proof/native
          fi

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          path: |
            .ota-proof-native-${{ matrix.name }}.json
            .ota-proof-docker-${{ matrix.name }}.json
            ota-proof-native-up-${{ matrix.name }}.log
            ota-proof-native-doctor-${{ matrix.name }}.json
            .ota/
          retention-days: 7
          include-hidden-files: true
